name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'frontend/**'
  workflow_dispatch:  # allow manual runs from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Check assignment sync secret is configured
        env:
          ASSIGNMENT_SYNC_SECRET: ${{ secrets.ASSIGNMENT_SYNC_SECRET }}
        run: |
          test -n "${ASSIGNMENT_SYNC_SECRET}" || {
            echo "Missing GitHub secret: ASSIGNMENT_SYNC_SECRET" >&2
            exit 1
          }
      - name: Sync assignments to backend
        env:
          BACKEND_ASSIGNMENTS_SYNC_URL: https://qbase.103.125.154.215.nip.io/api/internal/assignments/sync
          ASSIGNMENT_SYNC_SECRET: ${{ secrets.ASSIGNMENT_SYNC_SECRET }}
        run: node backend/scripts/push-assignments-to-backend.js

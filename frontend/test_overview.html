<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>QBase - Test Overview</title>
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />

    <link href="./common/theme.css" rel="stylesheet" />
    <link href="./common/index.css" rel="stylesheet" />
    <link href="./tests/tests.css" rel="stylesheet" />

    <script defer src="./common/config.js"></script>
    <script defer src="./common/navbar.js"></script>
    <script defer src="./tests/tests.service.js"></script>
  </head>
  <body class="bg-dark text-light" data-active="tests">
    <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand" href="./index.html">QBase</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="./bookmarks.html">Bookmarks</a></li>
            <li class="nav-item"><a class="nav-link" href="./pyqs.html">PYQs</a></li>
            <li class="nav-item"><a class="nav-link active" href="./tests.html">Tests</a></li>
          </ul>
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item" id="nav-login-item">
              <a class="nav-link" href="#" id="nav-login">Login</a>
            </li>
            <li class="nav-item dropdown d-none" id="nav-user-item">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="navbarUserDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span id="nav-username">User</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarUserDropdown">
                <li><a class="dropdown-item" href="#" id="nav-logout">Logout</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item text-danger" href="#" id="nav-delete-account">Delete Account...</a>
                </li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container-lg tests-overview-page">
      <a class="btn btn-sm btn-outline-secondary mb-3" href="./tests.html">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Tests</span>
      </a>

      <div id="test-overview-loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Loading test overview...</p>
      </div>

      <div id="test-overview-error" class="alert alert-danger d-none" role="alert"></div>

      <section id="test-overview-content" class="d-none">
        <div class="tests-overview-hero">
          <div>
            <p class="text-secondary small mb-1">Test Overview</p>
            <h1 id="test-overview-title" class="mb-2">Test</h1>
            <div id="test-overview-meta" class="tests-overview-meta"></div>
          </div>
          <div id="test-overview-best-score" class="tests-overview-best-score"></div>
        </div>

        <ul class="nav nav-tabs tests-overview-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="attempts-tab" data-bs-toggle="tab" data-bs-target="#attempts-pane" type="button" role="tab">
              Attempts
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="leaderboard-tab" data-bs-toggle="tab" data-bs-target="#leaderboard-pane" type="button" role="tab">
              Leaderboard
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="details-tab" data-bs-toggle="tab" data-bs-target="#details-pane" type="button" role="tab">
              Test Details
            </button>
          </li>
        </ul>

        <div class="tab-content tests-overview-tab-content">
          <section class="tab-pane fade show active" id="attempts-pane" role="tabpanel" aria-labelledby="attempts-tab">
            <div id="latest-attempt"></div>
            <div id="all-attempts"></div>
          </section>
          <section class="tab-pane fade" id="leaderboard-pane" role="tabpanel" aria-labelledby="leaderboard-tab">
            <div id="leaderboard"></div>
          </section>
          <section class="tab-pane fade" id="details-pane" role="tabpanel" aria-labelledby="details-tab">
            <div id="test-details"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script defer src="./tests/overview.js"></script>
  </body>
</html>
